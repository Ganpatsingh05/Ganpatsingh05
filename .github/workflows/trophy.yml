name: Update GitHub Trophies

on:
  schedule:
    - cron: "15 1 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate trophy SVG
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: Ganpatsingh05
          output_path: ./trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Move trophy into profile assets
        run: mv trophy.svg profile-trophy.svg

      - name: Commit trophy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-trophy.svg
          git diff --staged --quiet || git commit -m "Update GitHub trophies"
          git push
